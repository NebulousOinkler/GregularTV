# The web version: build, check and test it, and deploy it to gregular.tv
# (WEB_PLAN.md). Each push to main is built, tested and deployed (or run by
# hand). Each pull request is built and tested the same way, and
# its deploy is rehearsed without publishing (`deploy-check`), so a change
# that fails is caught before it's merged (AUDIT.md, P3). Deploying needs
# the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (README, *The
# web version*); without them, everything else still runs.
#
# Nothing that builds the site, or runs for a pull request, ever sees the
# deploy token: `build` and `deploy-check` have no secrets at all and no
# environment, and only `deploy`, on main, publishes what `build` made,
# with Wrangler as Web/package-lock.json pins it. Every tool is pinned:
# actions by commit, the WebAssembly SDK and binaryen by checksum, the
# toolchain installer by its signature.
name: Web

on:
  push:
    branches: [main]
  # Any pull request, into main or into another (a stack of them): not
  # pull_request_target, so its run gets no secrets and only read access,
  # whoever opened it.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_VERSION: 6.4.0
  WASM_SDK_URL: https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz
  WASM_SDK_CHECKSUM: f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d
  BINARYEN_VERSION: version_133
  BINARYEN_CHECKSUM: ad66da82ac13f163e424b1643f16c6dfcccc98b5966296b43e52d3cab04f84a8

jobs:
  build:
    # A run started by hand from another branch does nothing.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    # macOS, like development: the same toolchain installer and browsers.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Swift toolchain and its WebAssembly SDK
        run: |
          curl -fsSLO https://download.swift.org/swiftly/darwin/swiftly.pkg
          # Only the installer Swift's own team signed and Apple notarized.
          signature=$(pkgutil --check-signature swiftly.pkg)
          echo "$signature" | grep -q "Notarization: trusted by the Apple notary service"
          echo "$signature" | grep -q "Developer ID Installer: Swift Open Source (V9AUD2URP3)"
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --no-modify-profile --skip-install --quiet-shell-followup --assume-yes
          ~/.swiftly/bin/swiftly install "$SWIFT_VERSION" --assume-yes
          toolchain=~/Library/Developer/Toolchains/swift-$SWIFT_VERSION-RELEASE.xctoolchain
          "$toolchain/usr/bin/swift" sdk install "$WASM_SDK_URL" --checksum "$WASM_SDK_CHECKSUM"
          echo "GREGULAR_SWIFT_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Install wasm-opt (shrinks the app)
        run: |
          archive=binaryen-$BINARYEN_VERSION-arm64-macos.tar.gz
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/$archive"
          echo "$BINARYEN_CHECKSUM  $archive" | shasum -a 256 -c
          tar xzf "$archive"
          echo "$PWD/binaryen-$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Check the layers and privacy rules
        run: |
          scripts/layer-check.sh
          scripts/privacy-check.sh

      - name: Test the browser layer
        run: scripts/test-web.sh browser

      - name: Install Playwright and its browsers
        working-directory: Web
        run: |
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium webkit firefox

      - name: Make the demo server's video
        run: swift scripts/make-demo-video.swift

      - name: Build the release, and walk through it in Chromium, WebKit and Firefox
        run: scripts/test-web.sh walkthrough release

      - name: Keep the site for the deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: Web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Deploys can be made to wait for approval: add required reviewers to
    # this environment in the repository's settings (README, *The web version*).
    environment: gregular.tv
    env:
      # Whether deploying is set up. Only the deploy step sees the token itself.
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: Web

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: Web/dist

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No dependency cache in the job that holds the token: a cache is
          # shared with other runs, so it could be poisoned.
          package-manager-cache: false

      - name: Install Wrangler, as the lockfile pins it
        if: env.CAN_DEPLOY == 'true'
        working-directory: Web
        run: npm ci --no-fund --no-audit

      - name: Deploy to gregular.tv
        if: env.CAN_DEPLOY == 'true'
        working-directory: Web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # No usage reports to Cloudflare from the deploy.
          WRANGLER_SEND_METRICS: "false"
        run: npx --no-install wrangler deploy

  # A pull request's deploy, rehearsed with no secrets and no environment:
  # the same steps as `deploy`, ending in Wrangler's dry run, which checks
  # what would be published without publishing it.
  deploy-check:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: Web

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: Web/dist

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Wrangler, as the lockfile pins it
        working-directory: Web
        run: npm ci --no-fund --no-audit

      - name: Rehearse the deploy
        working-directory: Web
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx --no-install wrangler deploy --dry-run
